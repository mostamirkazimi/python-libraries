[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npdl"
version = "0.1.0"
description = "Deep learning from scratch with NumPy only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

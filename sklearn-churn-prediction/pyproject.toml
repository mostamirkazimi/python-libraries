[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churnml"
version = "0.1.0"
description = "Customer churn prediction workflow with scikit-learn"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.3", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mplx"
version = "0.1.0"
description = "Advanced Matplotlib visualization gallery"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
